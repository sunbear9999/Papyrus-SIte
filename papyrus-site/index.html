  <!-- ===================================================================
       PAGE METADATA (static — read by search engines and link previews)
       -------------------------------------------------------------------
       Crawlers and preview bots read this block before any JavaScript
       runs, which is why it lives in the HTML rather than in content.js.

       The <title> below is AUTHORITATIVE: js/render.js leaves it alone,
       and falls back to content.js only when a page shell still carries
       the bare placeholder title "Papyrus". If you rename this page in
       content.js, update the <title> and description here to match.
       =================================================================== -->
